[package]
name = "near-nn-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.6.1"
near-sdk = "5.26.1"

[dev-dependencies]
anyhow = "1"
near-api = "0.8.5"
near-sdk = { version = "5.26.1", features = ["unit-testing"] }
near-sandbox = "0.3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
